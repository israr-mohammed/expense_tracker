{% extends "base.html" %}

{% block title %}Analytics — Expense Tracker{% endblock %}

{% block content %}

<section class="coming-soon-section">
    <div class="coming-soon-container">

        <div class="coming-soon-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="20" x2="4" y2="12"></line>
                <line x1="10" y1="20" x2="10" y2="6"></line>
                <line x1="16" y1="20" x2="16" y2="14"></line>
                <line x1="20" y1="20" x2="20" y2="9"></line>
            </svg>
        </div>

        <span class="hero-badge">
            <span class="hero-badge-dot"></span>
            Coming Soon
        </span>

        <h1 class="coming-soon-title">Analytics</h1>
        <p class="coming-soon-subtitle">
            We're building powerful insights into your spending — trends, breakdowns, and
            forecasts, all in one place. Check back soon.
        </p>

        <div class="coming-soon-actions">
            <a href="{{ url_for('profile') }}" class="btn-primary">Back to Profile</a>
        </div>

    </div>
</section>

{% endblock %}
